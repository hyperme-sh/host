[package]
name = "hypermesh-host-crash-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hypermesh-crash-retention = { git = "https://github.com/hyperme-sh/visor", rev = "9a08ee1601f8559535ca03f255cc7719fc7f7447" }
hypermesh-local-storage = { git = "https://github.com/hyperme-sh/visor", rev = "9a08ee1601f8559535ca03f255cc7719fc7f7447" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
