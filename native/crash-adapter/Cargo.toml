[package]
name = "hypermesh-host-crash-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hypermesh-crash-retention = { git = "https://github.com/hyperme-sh/visor", rev = "f607d48da807e351e01fc16ee3a11c22b36f0683" }
hypermesh-local-storage = { git = "https://github.com/hyperme-sh/visor", rev = "f607d48da807e351e01fc16ee3a11c22b36f0683" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
