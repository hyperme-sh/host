[package]
name = "hypermesh-host-crash-adapter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hypermesh-crash-retention = { git = "https://github.com/hyperme-sh/visor", rev = "5ab6b90b19edfb2b5e59ef1ff3e107baee949bd7" }
hypermesh-local-storage = { git = "https://github.com/hyperme-sh/visor", rev = "5ab6b90b19edfb2b5e59ef1ff3e107baee949bd7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
